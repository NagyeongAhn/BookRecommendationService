server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1114

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        jdbc.time_zone: Asia/Seoul   # (= hibernate.jdbc.time_zone)
  # ✅ 프론트 연동용 CORS (React dev 서버 등)
  web:
    cors:
      allowed-origins:
        - "http://192.168.0.3:5173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

# 국립중앙도서관 OpenAPI
library:
  api:
    key: "8e00880838bb08e64594eae9009f220559c2703524c2190421c386f63b8f7d50"
    base-url: "https://www.nl.go.kr/NL/search/openApi"
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

# AI 서버(WebClient baseUrl)
ai:
  # 로컬 같은 PC에서 띄웠다면 localhost로 바꿔도 됩니다.
  base-url: "http://192.168.0.11:8000"

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace  # 바인딩 파라미터 보기(개발 때만)
